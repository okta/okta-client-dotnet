version: 2.1

orbs:
  windows: circleci/windows@5.0
  general-platform-helpers: okta/general-platform-helpers@1.9.4

jobs:
  build-windows:
    description: Build and test on Windows
    executor:
      name: windows/default
    environment:
      CIRCLE_CI: True
    steps:
      - checkout
      - run:
          name: "Install required components"
          command: |
            choco install -y dotnet-8.0-sdk
      - run:
          name: Restore NuGet packages
          command: dotnet restore Okta.Client.Sdk.sln
      - run:
          name: Build solution
          command: dotnet build Okta.Client.Sdk.sln --configuration Release --no-restore
      - run:
          name: Run unit tests
          command: dotnet test Okta.Client.Sdk.Tests/Okta.Client.Sdk.Tests.csproj --no-build --configuration Release --logger:"junit;LogFilePath=TestResults/results.xml" -- RunConfiguration.TreatNoTestsAsError=true
      - store_test_results:
          path: Okta.Client.Sdk.Tests/TestResults
      - persist_to_workspace:
          root: .
          paths:
            - .

  build-linux:
    description: Build and test on Linux
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    resource_class: large
    environment:
      CIRCLE_CI: True
    steps:
      - checkout
      - run:
          name: "Install D-Bus and keyring daemon"
          command: |
            apt-get update
            apt-get install -y dbus dbus-x11 gnome-keyring
      - run:
          name: Restore NuGet packages
          command: dotnet restore Okta.Client.Sdk.CrossPlatform.slnf
      - run:
          name: Build solution
          command: dotnet build Okta.Client.Sdk.CrossPlatform.slnf --configuration Release --no-restore
      - run:
          name: Run unit tests
          # Some tests need a session bus and an unlocked default collection.
          # The unlock password must be non-empty, or the daemon serves only
          # its in-memory collection and the "default" alias stays unresolved.
          command: |
            dbus-run-session -- bash -c '
              eval $(printf "ci" | gnome-keyring-daemon --unlock --components=secrets)
              export GNOME_KEYRING_CONTROL
              dotnet test Okta.Client.Sdk.Tests/Okta.Client.Sdk.Tests.csproj \
                --no-build --configuration Release \
                --logger:"junit;LogFilePath=TestResults/results.xml" \
                -- RunConfiguration.TreatNoTestsAsError=true
            '
      - store_test_results:
          path: Okta.Client.Sdk.Tests/TestResults

  snyk-scan:
    docker:
      - image: cimg/python:3.10
    steps:
      - attach_workspace:
          at: .
      - general-platform-helpers/step-load-dependencies
      - general-platform-helpers/step-run-snyk-monitor:
          scan-all-projects: true
          skip-unresolved: false
          run-on-non-main: true
          detection-depth: 4

workflows:
  "Build, Test & Scan":
    jobs:
      - build-windows
      - build-linux
      - snyk-scan:
          name: execute-snyk
          context:
            - static-analysis
          requires:
            - build-windows
